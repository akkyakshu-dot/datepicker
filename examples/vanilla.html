<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Datepicker - Vanilla JavaScript Example</title>
  <link rel="stylesheet" href="../dist/datepicker.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    .example {
      margin: 30px 0;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .datepicker-container {
      margin: 20px 0;
      display: inline-block;
    }
    .output {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Universal Datepicker - Vanilla JavaScript Examples</h1>
  
  <div class="example">
    <h2>Basic Datepicker</h2>
    <div id="basic-datepicker" class="datepicker-container"></div>
    <div id="basic-output" class="output">Selected date will appear here...</div>
  </div>

  <div class="example">
    <h2>Datepicker with Date Range</h2>
    <div id="range-datepicker" class="datepicker-container"></div>
    <div id="range-output" class="output">Selected date will appear here...</div>
  </div>

  <div class="example">
    <h2>Dark Theme Datepicker</h2>
    <div id="dark-datepicker" class="datepicker-container"></div>
    <div id="dark-output" class="output">Selected date will appear here...</div>
  </div>

  <div class="example">
    <h2>Datepicker with Week Numbers</h2>
    <div id="week-datepicker" class="datepicker-container"></div>
    <div id="week-output" class="output">Selected date will appear here...</div>
  </div>

  <script src="../dist/index.umd.js"></script>
  <script>
    const { createDatepicker } = UniversalDatepicker;

    // Basic datepicker
    const basicDatepicker = createDatepicker('#basic-datepicker', {
      onDateSelect: (date) => {
        document.getElementById('basic-output').textContent = 
          `Selected: ${date.toLocaleDateString()}`;
      }
    });

    // Date range datepicker
    const rangeDate = new Date();
    const rangeDatepicker = createDatepicker('#range-datepicker', {
      minDate: new Date(rangeDate.getFullYear(), rangeDate.getMonth(), 1),
      maxDate: new Date(rangeDate.getFullYear(), rangeDate.getMonth() + 2, 0),
      onDateSelect: (date) => {
        document.getElementById('range-output').textContent = 
          `Selected: ${date.toLocaleDateString()} (within allowed range)`;
      }
    });

    // Dark theme datepicker
    const darkDatepicker = createDatepicker('#dark-datepicker', {
      theme: 'dark',
      onDateSelect: (date) => {
        document.getElementById('dark-output').textContent = 
          `Selected: ${date.toLocaleDateString()}`;
      }
    });

    // Week numbers datepicker
    const weekDatepicker = createDatepicker('#week-datepicker', {
      showWeekNumbers: true,
      locale: 'en-US',
      onDateSelect: (date) => {
        document.getElementById('week-output').textContent = 
          `Selected: ${date.toLocaleDateString()} (with week numbers)`;
      }
    });

    // Show all datepickers
    basicDatepicker.show();
    rangeDatepicker.show();
    darkDatepicker.show();
    weekDatepicker.show();
  </script>
</body>
</html>
